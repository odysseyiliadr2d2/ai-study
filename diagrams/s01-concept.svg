<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 646" width="960" height="646" role="img" aria-label="생성형 AI는 딥러닝 안의, 딥러닝은 머신러닝 안의 한 갈래입니다" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', sans-serif"><title>생성형 AI는 딥러닝 안의, 딥러닝은 머신러닝 안의 한 갈래입니다</title><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A8680"/></marker></defs><rect x="1" y="1" width="958" height="644" rx="18" fill="#FFFFFF" stroke="#DEDBD6" stroke-width="1.5"/><rect x="32" y="26" width="5" height="26" rx="2.5" fill="#F26B1D"/><text x="48" y="46" font-size="21" font-weight="700" fill="#1F1F1F">생성형 AI는 딥러닝 안의, 딥러닝은 머신러닝 안의 한 갈래입니다</text><text x="48" y="72" font-size="13.5" fill="#5C5A57">바깥 상자일수록 넓은 개념 · 안쪽으로 갈수록 데이터와 계산량이 커집니다</text><rect x="38.0" y="103.0" width="884.0" height="468.0" rx="14" fill="#ECEFF7" fill-opacity="0.45" stroke="#2B3A67" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="50.0" y="93.0" width="98.6" height="20" rx="10" fill="#FFFFFF" stroke="#2B3A67" stroke-width="1.4"/><text x="59.0" y="107.0" font-size="12" font-weight="700" fill="#2B3A67">AI (인공지능)</text><rect x="262.0" y="223.0" width="660.0" height="348.0" rx="14" fill="#EAF2FF" fill-opacity="0.45" stroke="#2F6FDE" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="274.0" y="213.0" width="66.0" height="20" rx="10" fill="#FFFFFF" stroke="#2F6FDE" stroke-width="1.4"/><text x="283.0" y="227.0" font-size="12" font-weight="700" fill="#2F6FDE">머신러닝</text><rect x="486.0" y="343.0" width="436.0" height="228.0" rx="14" fill="#F1EDFC" fill-opacity="0.45" stroke="#7656D6" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="498.0" y="333.0" width="54.0" height="20" rx="10" fill="#FFFFFF" stroke="#7656D6" stroke-width="1.4"/><text x="507.0" y="347.0" font-size="12" font-weight="700" fill="#7656D6">딥러닝</text><rect x="710.0" y="463.0" width="212.0" height="108.0" rx="14" fill="#FCEBF2" fill-opacity="0.45" stroke="#D2457C" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="722.0" y="453.0" width="73.2" height="20" rx="10" fill="#FFFFFF" stroke="#D2457C" stroke-width="1.4"/><text x="731.0" y="467.0" font-size="12" font-weight="700" fill="#D2457C">생성형 AI</text><rect x="50.0" y="116.0" width="188.0" height="80.0" rx="12" fill="#ECEFF7" stroke="#2B3A67" stroke-width="2"/><circle cx="135.0" cy="126.5" r="2" fill="#2B3A67"/><circle cx="135.0" cy="133.5" r="2" fill="#2B3A67"/><circle cx="135.0" cy="140.5" r="2" fill="#2B3A67"/><path d="M141.0 126.5H155.0M141.0 133.5H155.0M141.0 140.5H151.0" fill="none" stroke="#2B3A67" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="144.0" y="165.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">규칙 기반</text><text x="144.0" y="186.5" font-size="12" fill="#5C5A57" text-anchor="middle">사람이 if-then 규칙을 씀</text><rect x="274.0" y="236.0" width="188.0" height="80.0" rx="12" fill="#EAF2FF" stroke="#2F6FDE" stroke-width="2"/><path d="M356.0 264.5H380.0" fill="none" stroke="#2F6FDE" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><rect x="358.0" y="252.5" width="5" height="11" fill="#2F6FDE" fill-opacity="0.18" stroke="#2F6FDE" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><rect x="365.5" y="245.5" width="5" height="18" fill="#2F6FDE" fill-opacity="0.18" stroke="#2F6FDE" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><rect x="373.0" y="249.5" width="5" height="14" fill="#2F6FDE" fill-opacity="0.18" stroke="#2F6FDE" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="368.0" y="285.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">고전 ML</text><text x="368.0" y="306.5" font-size="12" fill="#5C5A57" text-anchor="middle">데이터에서 규칙을 배움</text><rect x="498.0" y="356.0" width="188.0" height="80.0" rx="12" fill="#F1EDFC" stroke="#7656D6" stroke-width="2"/><path d="M592.0 366.5L583.0 380.5M592.0 366.5L601.0 380.5M583.0 380.5H601.0" fill="none" stroke="#7656D6" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="592.0" cy="366.5" r="5" fill="#7656D6" fill-opacity="0.18" stroke="#7656D6" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="583.0" cy="380.5" r="5" fill="#7656D6" fill-opacity="0.18" stroke="#7656D6" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="601.0" cy="380.5" r="5" fill="#7656D6" fill-opacity="0.18" stroke="#7656D6" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="592.0" y="405.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">신경망 인식</text><text x="592.0" y="426.5" font-size="12" fill="#5C5A57" text-anchor="middle">여러 층 신경망</text><rect x="722.0" y="476.0" width="188.0" height="80.0" rx="12" fill="#FCEBF2" stroke="#D2457C" stroke-width="2.6"/><path d="M816.0 481.5Q818.0 491.5 828.0 493.5Q818.0 495.5 816.0 505.5Q814.0 495.5 804.0 493.5Q814.0 491.5 816.0 481.5Z" fill="#D2457C" fill-opacity="0.18" stroke="#D2457C" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="816.0" y="525.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">LLM</text><text x="816.0" y="546.5" font-size="12" fill="#5C5A57" text-anchor="middle">글·코드를 새로 만듦</text><rect x="274.0" y="116.0" width="636.0" height="80.0" rx="12" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/><path d="M587.0 135.5L580.0 143.5L587.0 151.5M597.0 135.5L604.0 143.5L597.0 151.5M594.0 133.5L590.0 153.5" fill="none" stroke="#6B7280" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/><text x="592.0" y="175.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">정보계 예: 데이터 품질 점검 SQL, 한도 초과 경고</text><rect x="498.0" y="236.0" width="412.0" height="80.0" rx="12" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/><rect x="693.0" y="252.5" width="22" height="22" rx="2.5" fill="#6B7280" fill-opacity="0.18" stroke="#6B7280" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M693.0 259.5H715.0M693.0 267.5H715.0M701.0 252.5V274.5" fill="none" stroke="#6B7280" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="704.0" y="295.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">예: 이탈 예측, 이상거래 점수</text><rect x="722.0" y="356.0" width="188.0" height="80.0" rx="12" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/><path d="M804.0 383.5Q816.0 372.5 828.0 383.5Q816.0 394.5 804.0 383.5Z" fill="#6B7280" fill-opacity="0.18" stroke="#6B7280" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="816.0" cy="383.5" r="3.2" fill="#6B7280"/><text x="816.0" y="415.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">예: 스캔 문서 인식</text><text x="36" y="606.0" font-size="12.5" fill="#5C5A57">· LLM은 생성형 AI의 대표이고, 생성형 AI는 딥러닝의, 딥러닝은 머신러닝의, 머신러닝은 AI의 일부입니다.</text></svg>
