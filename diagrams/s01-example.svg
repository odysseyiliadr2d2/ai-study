6" rx="4" fill="#FFFFFF" fill-opacity="0.92"/><text x="433.0" y="149.0" font-size="11.5" font-weight="600" fill="#5C5A57" text-anchor="middle">예</text><rect x="458.8" y="261.0" width="42.5" height="16" rx="4" fill="#FFFFFF" fill-opacity="0.92"/><text x="480.0" y="273.0" font-size="11.5" font-weight="600" fill="#5C5A57" text-anchor="middle">아니오</text><rect x="694.2" y="261.0" width="19.5" height="16" rx="4" fill="#FFFFFF" fill-opacity="0.92"/><text x="704.0" y="273.0" font-size="11.5" font-weight="600" fill="#5C5A57" text-anchor="middle">예</text><rect x="605.4" y="385.0" width="103.2" height="16" rx="4" fill="#FFFFFF" fill-opacity="0.92"/><text x="657.0" y="397.0" font-size="11.5" font-weight="600" fill="#5C5A57" text-anchor="middle">아니오 · 자유 문장</text><text x="36" y="498.0" font-size="12.5" fill="#5C5A57">· 설명 책임이 크면 규칙을 우선하고, LLM 결과는 사람이 확인하는 단계를 둡니다.</text></svg>
