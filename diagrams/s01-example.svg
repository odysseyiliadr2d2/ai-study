<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 538" width="960" height="538" role="img" aria-label="규칙으로 쓸 수 있으면 규칙, 데이터가 쌓였으면 ML, 문장을 다루면 LLM" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', sans-serif"><title>규칙으로 쓸 수 있으면 규칙, 데이터가 쌓였으면 ML, 문장을 다루면 LLM</title><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A8680"/></marker></defs><rect x="1" y="1" width="958" height="536" rx="18" fill="#FFFFFF" stroke="#DEDBD6" stroke-width="1.5"/><rect x="32" y="26" width="5" height="26" rx="2.5" fill="#F26B1D"/><text x="48" y="46" font-size="21" font-weight="700" fill="#1F1F1F">규칙으로 쓸 수 있으면 규칙, 데이터가 쌓였으면 ML, 문장을 다루면 LLM</text><text x="48" y="72" font-size="13.5" fill="#5C5A57">정보계 업무 하나를 놓고 방식을 고르는 두 개의 질문</text><path d="M238.0 282.0H274.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M368.0 240.0V158.0H498.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M462.0 282.0H498.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M686.0 282.0H722.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M592.0 324.0V406.0H722.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><rect x="50.0" y="240.0" width="188.0" height="84.0" rx="12" fill="#ECEFF7" stroke="#2B3A67" stroke-width="2"/><circle cx="144.0" cy="259.5" r="11" fill="#2B3A67" fill-opacity="0.18" stroke="#2B3A67" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="144.0" cy="259.5" r="6" fill="none" stroke="#2B3A67" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="144.0" cy="259.5" r="2" fill="#2B3A67"/><text x="144.0" y="291.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">업무 요건</text><text x="144.0" y="312.5" font-size="12" fill="#5C5A57" text-anchor="middle">무엇을 자동화하나</text><rect x="274.0" y="240.0" width="188.0" height="84.0" rx="12" fill="#FFF6D9" stroke="#C08A00" stroke-width="2"/><circle cx="359.0" cy="252.5" r="2" fill="#C08A00"/><circle cx="359.0" cy="259.5" r="2" fill="#C08A00"/><circle cx="359.0" cy="266.5" r="2" fill="#C08A00"/><path d="M365.0 252.5H379.0M365.0 259.5H379.0M365.0 266.5H375.0" fill="none" stroke="#C08A00" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="368.0" y="291.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">규칙으로 쓸 수 있나</text><text x="368.0" y="312.5" font-size="12" fill="#5C5A57" text-anchor="middle">판단 기준이 명확한가</text><circle cx="276.0" cy="242.0" r="12" fill="#C08A00"/><text x="276.0" y="246.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><rect x="498.0" y="116.0" width="188.0" height="84.0" rx="12" fill="#E7F6EF" stroke="#13976A" stroke-width="2"/><path d="M587.0 127.5L580.0 135.5L587.0 143.5M597.0 127.5L604.0 135.5L597.0 143.5M594.0 125.5L590.0 145.5" fill="none" stroke="#13976A" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/><text x="592.0" y="167.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">규칙 · SQL</text><text x="592.0" y="188.5" font-size="12" fill="#5C5A57" text-anchor="middle">한도 점검, 데이터 품질 검증</text><rect x="498.0" y="240.0" width="188.0" height="84.0" rx="12" fill="#FFF6D9" stroke="#C08A00" stroke-width="2"/><path d="M582.0 252.5V267.5A10 4 0 0 0 602.0 267.5V252.5" fill="#C08A00" fill-opacity="0.18" stroke="#C08A00" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="592.0" cy="252.5" rx="10" ry="4" fill="#C08A00" fill-opacity="0.18" stroke="#C08A00" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M582.0 260.5A10 4 0 0 0 602.0 260.5" fill="none" stroke="#C0