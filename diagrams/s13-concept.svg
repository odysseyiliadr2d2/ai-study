<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 572" width="960" height="572" role="img" aria-label="코딩 에이전트는 규칙 파일을 읽고, 권한 안에서 도구를 써서 일합니다" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', sans-serif"><title>코딩 에이전트는 규칙 파일을 읽고, 권한 안에서 도구를 써서 일합니다</title><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A8680"/></marker></defs><rect x="1" y="1" width="958" height="570" rx="18" fill="#FFFFFF" stroke="#DEDBD6" stroke-width="1.5"/><rect x="32" y="26" width="5" height="26" rx="2.5" fill="#F26B1D"/><text x="48" y="46" font-size="21" font-weight="700" fill="#1F1F1F">코딩 에이전트는 규칙 파일을 읽고, 권한 안에서 도구를 써서 일합니다</text><text x="48" y="72" font-size="13.5" fill="#5C5A57">사람은 지시와 검토, 에이전트는 읽기·수정·실행 — 경계는 규칙·권한·훅이 정합니다</text><path d="M238.0 160.0H274.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M722.0 160.0H686.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M480.0 204.0V244.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M144.0 332.0V372.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M368.0 332.0V372.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M592.0 332.0V372.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M816.0 332.0V372.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><rect x="50.0" y="116.0" width="188.0" height="88.0" rx="12" fill="#FFF1E7" stroke="#E8661C" stroke-width="2"/><circle cx="144.0" cy="132.5" r="5" fill="#E8661C" fill-opacity="0.18" stroke="#E8661C" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round