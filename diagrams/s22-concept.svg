<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 446" width="960" height="446" role="img" aria-label="지식은 RAG로 넣고, 행동은 파인튜닝으로 바꿉니다" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', sans-serif"><title>지식은 RAG로 넣고, 행동은 파인튜닝으로 바꿉니다</title><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A8680"/></marker></defs><rect x="1" y="1" width="958" height="444" rx="18" fill="#FFFFFF" stroke="#DEDBD6" stroke-width="1.5"/><rect x="32" y="26" width="5" height="26" rx="2.5" fill="#F26B1D"/><text x="48" y="46" font-size="21" font-weight="700" fill="#1F1F1F">지식은 RAG로 넣고, 행동은 파인튜닝으로 바꿉니다</text><text x="48" y="72" font-size="13.5" fill="#5C5A57">무엇이 부족한지에 따라 고치는 곳이 다릅니다</text><path d="M312.7 166.0H348.7" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M611.3 166.0H647.3" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M181.3 216.0V256.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M480.0 216.0V256.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M778.7 216.0V256.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><rect x="50.0" y="116.0" width="262.7" height="100.0" rx="12" fill="#FFF6D9" stroke="#C08A00" stroke-width="2"/><circle cx="172.3" cy="136.5" r="2" fill="#C08A00"/><circle cx="172.3" cy="143.5" r="2" fill="#C08A00"/><circle cx="172.3" cy="150.5" r="2" fill="#C08A00"/><path d="M178.3 136.5H192.3M178.3 143.5H192.3M178.3 150.5H188.3" fill="none" stroke="#C08A00" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="181.3" y="175.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">프롬프트</text><text x="181.3" y="196.5" font-size="12" fill="#5C5A57" text-anchor="middle">지시·예시 몇 개로 먼저 시도</text><circle cx="52.0" cy="118.0" r="12" fill="#C08A00"/><text x="52.0" y="122.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><rect x="348.7" y="116.0" width="262.7" height="100.0" rx="12" fill="#E7F6EF" stroke="#13976A" stroke-width="2"/><circle cx="477.0" cy="140.5" r="8" fill="#13976A" fill-opacity="0.18" stroke="#13976A" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M483.0 146.5L491.0 154.5" fill="none" stroke="#13976A" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/><text x="480.0" y="175.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">RAG</text><text x="480.0" y="196.5" font-size="12" fill="#5C5A57" text-anchor="middle">모르는 사실·최신 문서를 붙여 줌</text><circle cx="350.7" cy="118.0" r="12" fill="#13976A"/><text x="350.7" y="122.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><rect x="647.3" y="116.0" width="262.7" height="100.0" rx="12" fill="#F1EDFC" stroke="#7656D6" stroke-width="2"/><path d="M778.7 132.5Q767.7 131.5 767.7 141.5Q765.7 149.5 772.7 153.5Q777.7 156.5 778.7 151.5Q779.7 156.5 784.7 153.5Q791.7 149.5 789.7 141.5Q789.7 131.5 778.7 132.5Z" fill="#7656D6" fill-opacity="0.18" stroke="#7656D6" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M778.7 132.5V151.5M772.7 140.5Q775.7 143.5 778.7 140.5M784.7 145.5Q781.7 148.5 778.7 145.5" fill="none" stroke="#7656D6" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="778.7" y="175.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">파인튜닝 (LoRA)</text><text x="778.7" y="196.5" font-size="12" fill="#5C5A57" text-anchor="middle">형식·말투·분류 습관을 학습</text><circle cx="649.3" cy="118.0" r="12" fill="#7656D6"/><text x="649.3" y="122.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><rect x="50.0" y="256.0" width=