th="92.2" height="16" rx="4" fill="#FFFFFF" fill-opacity="0.92"/><text x="330.7" y="157.0" font-size="11.5" font-weight="600" fill="#5C5A57" text-anchor="middle">사실이 부족하면</text><rect x="581.4" y="145.0" width="95.9" height="16" rx="4" fill="#FFFFFF" fill-opacity="0.92"/><text x="629.3" y="157.0" font-size="11.5" font-weight="600" fill="#5C5A57" text-anchor="middle">형식이 안 맞으면</text><text x="36" y="406.0" font-size="12.5" fill="#5C5A57">· 둘 다 필요한 경우가 많습니다: RAG 로 근거를 주고, 작은 LoRA 로 답하는 형식을 맞춥니다.</text></svg>
