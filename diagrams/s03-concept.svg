<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 438" width="960" height="438" role="img" aria-label="좋은 프롬프트는 역할 · 맥락 · 제약 · 출력형식 네 칸을 채웁니다" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', sans-serif"><title>좋은 프롬프트는 역할 · 맥락 · 제약 · 출력형식 네 칸을 채웁니다</title><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A8680"/></marker></defs><rect x="1" y="1" width="958" height="436" rx="18" fill="#FFFFFF" stroke="#DEDBD6" stroke-width="1.5"/><rect x="32" y="26" width="5" height="26" rx="2.5" fill="#F26B1D"/><text x="48" y="46" font-size="21" font-weight="700" fill="#1F1F1F">좋은 프롬프트는 역할 · 맥락 · 제약 · 출력형식 네 칸을 채웁니다</text><text x="48" y="72" font-size="13.5" fill="#5C5A57">네 칸 + 입력 데이터를 조립하면 업무용 프롬프트 하나가 됩니다</text><rect x="38.0" y="103.0" width="884.0" height="124.0" rx="14" fill="#ECEFF7" fill-opacity="0.45" stroke="#2B3A67" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="50.0" y="93.0" width="200.9" height="20" rx="10" fill="#FFFFFF" stroke="#2B3A67" stroke-width="1.4"/><text x="59.0" y="107.0" font-size="12" font-weight="700" fill="#2B3A67">시스템 프롬프트 · 매번 같은 네 칸</text><path d="M368.0 212.0V252.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M592.0 212.0V252.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M238.0 300.0H274.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M686.0 300.0H722.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M816.0 212.0V252.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><rect x="50.0" y="116.0" width="188.0" height="96.0" rx="12" fill="#EAF2FF" stroke="#2F6FDE" stroke-width="2"/><circle cx="144.0" cy="128.5" r="5" fill