<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 538" width="960" height="538" role="img" aria-label="사람 승인은 워크플로 단계와 도구 호출 단계, 두 곳에 둘 수 있습니다" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', sans-serif"><title>사람 승인은 워크플로 단계와 도구 호출 단계, 두 곳에 둘 수 있습니다</title><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A8680"/></marker></defs><rect x="1" y="1" width="958" height="536" rx="18" fill="#FFFFFF" stroke="#DEDBD6" stroke-width="1.5"/><rect x="32" y="26" width="5" height="26" rx="2.5" fill="#F26B1D"/><text x="48" y="46" font-size="21" font-weight="700" fill="#1F1F1F">사람 승인은 워크플로 단계와 도구 호출 단계, 두 곳에 둘 수 있습니다</text><text x="48" y="72" font-size="13.5" fill="#5C5A57">되돌릴 수 없는 행동(발송·수정·결제) 바로 앞에 둡니다</text><rect x="38.0" y="103.0" width="436.0" height="360.0" rx="14" fill="#EAF2FF" fill-opacity="0.45" stroke="#2F6FDE" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="50.0" y="93.0" width="137.0" height="20" rx="10" fill="#FFFFFF" stroke="#2F6FDE" stroke-width="1.4"/><text x="59.0" y="107.0" font-size="12" font-weight="700" fill="#2F6FDE">A. 워크플로 단계 승인</text><rect x="486.0" y="103.0" width="436.0" height="360.0" rx="14" fill="#F1EDFC" fill-opacity="0.45" stroke="#7656D6" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="498.0" y="93.0" width="212.4" height="20" rx="10" fill="#FFFFFF" stroke="#7656D6" stroke-width="1.4"/><text x="507.0" y="107.0" font-size="12" font-weight="700" fill="#7656D6">B. 도구 호출 승인 (Human review)</text><path d="M256.0 200.0V240.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M256.0 324.0V364.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M704.0 200.0V240.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M704.0 324.0V364.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><rect x="50.0" y="116.0" width="412.0" height="84.0" rx="12" fill="#EAF2FF" stroke="#2F6FDE" stroke-width="2"/><path d="M256.0 127.5V123.5" fill="none" stroke="#2F6FDE" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="256.0" cy="122.5" r="2" fill="#2F6FDE"/><rect x="245.0" y="127.5" width="22" height="18" rx="5" fill="#2F6FDE" fill-opacity="0.18" stroke="#2F6FDE" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="251.5" cy="136.5" r="2" fill="#2F6FDE"/><circle cx="260.5" cy="136.5" r="2" fill="#2F6FDE"/><text x="256.0" y="167.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">에이전트가 초안 생성</text><text x="256.0" y="188.5" font-size="12" fill="#5C5A57" text-anchor="middle">결과를 다음 노드로 넘김</text><circle cx="52.0" cy="118.0" r="12" fill="#2F6FDE"/><text x="52.0" y="122.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><rect x="50.0" y="240.0" width="412.0" height="84.0" rx="12" fill="#FFF6D9" stroke="#C08A00" stroke-width="2"/><circle cx="256.0" cy="259.5" r="11" fill="#C08A00" fill-opacity="0.18" stroke="#C08A00" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M256.0 253.5V259.5L261.0 262.5" fill="none" stroke="#C08A00" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="256.0" y="291.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">Send and Wait</text><text x="256.0" y="312.5" font-size="12" fill="#5C5A57" text-anchor="middle">Gmail·Slack 승인 버튼 · 실행 일시정지</text><circle cx="52.0" cy="242.0" r="12" fill="#C08A00"/><text x="52.0" y="246.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><rect x="50.0" y="364.0" width="412.0" height="84.0" rx="12" fill="#E7F6EF" stroke="#13976A" stroke-width="2"/><path d="M244.0 382.5L268.0 373.5L260.0 394.5L256.0 385.5Z" fill="#13976A" fill-opacity="0.18" stroke="#13976A" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M256.0 385.5L268.0 373.5" fill="none" stroke="#13976A" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="256.0" y="415.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">IF 승인 → 발송</text><text x="256.0" y="436.5" font-size="12" fill="#5C5A57" text-anchor="middle">거절이면 기록만 · 대기 시간 제한</text><circle cx="52.0" cy="366.0" r="12" fill="#13976A"/><text x="52.0" y="370.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><rect x="498.0" y="116.0" width="412.0" height="84.0" rx="12" fill="#F1EDFC" stroke="#7656D6" stroke-width="2"/><path d="M704.0 127.5V123.5" fill="none" stroke="#7656D6" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="704.0" cy="122.5" r="2" fill="#7656D6"/><rect x="693.0" y="127.5" width="22" height="18" rx="5" fill="#7656D6" fill-opacity="0.18" stroke="#7656D6" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="699.5" cy="136.5" r="2" fill="#7656D6"/><circle cx="708.5" cy="136.5" r="2" fill="#7656D6"/><text x="704.0" y="167.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">에이전트가 도구 호출 결정</text><text x="704.0" y="188.5" font-size="12" fill="#5C5A57" text-anchor="middle">예: send_reply(to, body)</text><circle cx="500.0" cy="118.0" r="12" fill="#7656D6"/><text x="500.0" y="122.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><rect x="498.0" y="240.0" width="412.0" height="84.0" rx="12" fill="#FFF6D9" stroke="#C08A00" stroke-width="2"/><path d="M704.0 247.5L714.0 251.5V259.5Q714.0 268.5 704.0 271.5Q694.0 268.5 694.0 259.5V251.5Z" fill="#C08A00" fill-opacity="0.18" stroke="#C08A00" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="704.0" y="291.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">Human review</text><text x="704.0" y="312.5" font-size="12" fill="#5C5A57" text-anchor="middle">도구 실행 전 승인 요청</text><circle cx="500.0" cy="242.0" r="12" fill="#C08A00"/><text x="500.0" y="246.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><rect x="498.0" y="364.0" width="412.0" height="84.0" rx="12" fill="#E7F6EF" stroke="#13976A" stroke-width="2"/><path d="M714.0 380.5A10.5 10.5 0 1 0 714.0 387.5" fill="none" stroke="#13976A" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M715.0 372.5V380.5H707.0" fill="none" stroke="#13976A" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="704.0" y="415.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">승인 시 실행 · 거절 시 통보</text><text x="704.0" y="436.5" font-size="12" fill="#5C5A57" text-anchor="middle">거절 사실을 모델이 알고 다른 길 선택</text><circle cx="500.0" cy="366.0" r="12" fill="#13976A"/><text x="500.0" y="370.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="36" y="498.0" font-size="12.5" fill="#5C5A57">· A 는 흐름이 단순하고 감사 기록이 명확합니다. B 는 에이전트가 여러 도구를 쓰는 중 일부만 막을 때 씁니다.</text></svg>
