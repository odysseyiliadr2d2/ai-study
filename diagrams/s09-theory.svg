<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 408" width="960" height="408" role="img" aria-label="좋은 RAG는 청크 · 검색 · 프롬프트 세 곳에서 갈립니다" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', sans-serif"><title>좋은 RAG는 청크 · 검색 · 프롬프트 세 곳에서 갈립니다</title><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A8680"/></marker></defs><rect x="1" y="1" width="958" height="406" rx="18" fill="#FFFFFF" stroke="#DEDBD6" stroke-width="1.5"/><rect x="32" y="26" width="5" height="26" rx="2.5" fill="#F26B1D"/><text x="48" y="46" font-size="21" font-weight="700" fill="#1F1F1F">좋은 RAG는 청크 · 검색 · 프롬프트 세 곳에서 갈립니다</text><text x="48" y="72" font-size="13.5" fill="#5C5A57">각 단계에서 정하는 값과 품질에 미치는 영향</text><path d="M312.7 166.0H348.7" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M611.3 166.0H647.3" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M181.3 216.0V256.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M480.0 216.0V256.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M778.7 216.0V256.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><rect x="50.0" y="116.0" width="262.7" height="100.0" rx="12" fill="#F1EDFC" stroke="#7656D6" stroke-width="2"/><path d="M181.3 124.5L193.3 130.5L181.3 136.5L169.3 130.5Z" fill="#7656D6" fill-opacity="0.18" stroke="#7656D6" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M169.3 136.5L181.3 142.5L193.3 136.5M169.3 141.5L181.3 147.5L193.3 141.5" fill="none" stroke="#7656D6" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="181.3" y="167.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">① 청킹</text><text x="181.3" y="188.5" font-size="12" fill="#5C5A57" text-anchor="middle">크기 300~800자 · 겹침 10~20% · 제목</text><text x="181.3" y="204.5" font-size="12" fill="#5C5A57" text-anchor="middle">붙이기</text><circle cx="52.0" cy="118.0" r="12" fill="#7656D6"/><text x="52.0" y="122.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><rect x="348.7" y="116.0" width="262.7" height="100.0" rx="12" fill="#E7F6EF" stroke="#13976A" stroke-width="2"/><circle cx="477.0" cy="140.5" r="8" fill="#13976A" fill-opacity="0.18" stroke="#13976A" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M483.0 146.5L491.0 154.5" fill="none" stroke="#13976A" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/><text x="480.0" y="175.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">② 검색</text><text x="480.0" y="196.5" font-size="12" fill="#5C5A57" text-anchor="middle">임베딩 모델 · 유사도(코사인) · k = 3~8</text><circle cx="350.7" cy="118.0" r="12" fill="#13976A"/><text x="350.7" y="122.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><rect x="647.3" y="116.0" width="262.7" height="100.0" rx="12" fill="#FFF6D9" stroke="#C08A00" stroke-width="2"/><circle cx="769.7" cy="136.5" r="2" fill="#C08A00"/><circle cx="769.7" cy="143.5" r="2" fill="#C08A00"/><circle cx="769.7" cy="150.5" r="2" fill="#C08A00"/><path d="M775.7 136.5H789.7M775.7 143.5H789.7M775.7 150.5H785.7" fill="none" stroke="#C08A00" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="778.7" y="175.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">③ 프롬프트</text><text x="778.7" y="196.5" font-size="12" fill="#5C5A57" text-anchor="middle">근거 번호 · 출처 표기 · 모르면 모른다고</text><circle cx="649.3" cy="118.0" r="12" fill="#C08A00"/><text x="649.3" y="122.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><rect x="50.0" y="256.0" widt