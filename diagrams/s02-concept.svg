<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" width="960" height="336" role="img" aria-label="LLM은 글을 토큰으로 쪼개고, 벡터로 바꿔, 다음 토큰을 맞힙니다" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', sans-serif"><title>LLM은 글을 토큰으로 쪼개고, 벡터로 바꿔, 다음 토큰을 맞힙니다</title><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A8680"/></marker></defs><rect x="1" y="1" width="958" height="334" rx="18" fill="#FFFFFF" stroke="#DEDBD6" stroke-width="1.5"/><rect x="32" y="26" width="5" height="26" rx="2.5" fill="#F26B1D"/><text x="48" y="46" font-size="21" font-weight="700" fill="#1F1F1F">LLM은 글을 토큰으로 쪼개고, 벡터로 바꿔, 다음 토큰을 맞힙니다</text><text x="48" y="72" font-size="13.5" fill="#5C5A57">문장 하나가 모델 안에서 거치는 다섯 단계</text><path d="M163.3 181.0H199.3" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M312.7 181.0H348.7" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M462.0 181.0H498.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M611.3 181.0H647.3" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M760.7 181.0H796.7" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><rect x="50.0" y="116.0" width="113.3" height="130.0" rx="12" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/><path d="M97.7 146.5H110.7L116.7 152.5V170.5H97.7Z" fill="#6B7280" fill-opacity="0.18" stroke="#6B7280" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M102.7 156.5H111.7M102.7 161.5H111.7M102.7 166.5H108.7" fill="none" stroke="#6B7280" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="106.7" y="190.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">입력 문장</text><text x="106.7" y="211.5" font-size="12" fill="#5C5A57" text-anchor="middle">배치가 실패하면</text><circle cx="52.0" cy="118.0" r="12" fill="#6B7280"/><text x="52.0" y="122.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><rect x="199.3" y="116.0" width="113.3" height="130.0" rx="12" fill="#FFF1E7" stroke="#E8661C" stroke-width="2"/><rect x="244.0" y="143.5" width="7" height="14" rx="2" fill="#E8661C" fill-opacity="0.18" stroke="#E8661C" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><rect x="252.5" y="143.5" width="7" height="14" rx="2" fill="#E8661C" fill-opacity="0.18" stroke="#E8661C" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><rect x="261.0" y="143.5" width="7" height="14" rx="2" fill="#E8661C" fill-opacity="0.18" stroke="#E8661C" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="256.0" y="182.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">토큰화</text><text x="256.0" y="203.5" font-size="12" fill="#5C5A57" text-anchor="middle">글자 조각 단위 ·</text><text x="256.0" y="219.5" font-size="12" fill="#5C5A57" text-anchor="middle">ID 번호로</text><circle cx="201.3" cy="118.0" r="12" fill="#E8661C"/><text x="201.3" y="122.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><rect x="348.7" y="116.0" width="113.3" height="130.0" rx="12" fill="#F1EDFC" stroke="#7656D6" stroke-width="2"/><path d="M394.3 160.5L414.3 142.5M394.3 160.5L416.3 156.5M394.3 160.5L402.3 139.5" fill="none" stroke="#7656D6" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="394.3" cy="160.5" r="2" fill="#7656D6"/><path d="M410.3 142.5H414.3V146.5" fill="none" stroke="#7656D6" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="405.3" y="182.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">임베딩</text><text x="405.3" y="203.5" font-size="12" fill="#5C5A57" text-ancho