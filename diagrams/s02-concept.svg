F1F1F" text-anchor="middle">확률 분포</text><text x="704.0" y="203.5" font-size="12" fill="#5C5A57" text-anchor="middle">다음 토큰 후보별</text><text x="704.0" y="219.5" font-size="12" fill="#5C5A57" text-anchor="middle">확률</text><circle cx="649.3" cy="118.0" r="12" fill="#0E8F9C"/><text x="649.3" y="122.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><rect x="796.7" y="116.0" width="113.3" height="130.0" rx="12" fill="#FCEBF2" stroke="#D2457C" stroke-width="2.6"/><path d="M853.3 138.5Q855.3 148.5 865.3 150.5Q855.3 152.5 853.3 162.5Q851.3 152.5 841.3 150.5Q851.3 148.5 853.3 138.5Z" fill="#D2457C" fill-opacity="0.18" stroke="#D2457C" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="853.3" y="182.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">다음 토큰</text><text x="853.3" y="203.5" font-size="12" fill="#5C5A57" text-anchor="middle">하나 골라 문장</text><text x="853.3" y="219.5" font-size="12" fill="#5C5A57" text-anchor="middle">뒤에 붙임</text><circle cx="798.7" cy="118.0" r="12" fill="#D2457C"/><text x="798.7" y="122.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="36" y="296.0" font-size="12.5" fill="#5C5A57">· 모델이 아는 것은 &#x27;이 문맥 다음에 어떤 토큰이 올 확률이 높은가&#x27; 하나뿐입니다. 사실 여부는 따로 확인하지 않습니다.</text></svg>
