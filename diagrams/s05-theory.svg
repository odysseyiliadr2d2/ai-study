<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 466" width="960" height="466" role="img" aria-label="자동화 후보는 빈도 × 소요시간이 큰 일부터 고릅니다" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', sans-serif"><title>자동화 후보는 빈도 × 소요시간이 큰 일부터 고릅니다</title><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A8680"/></marker></defs><rect x="1" y="1" width="958" height="464" rx="18" fill="#FFFFFF" stroke="#DEDBD6" stroke-width="1.5"/><rect x="32" y="26" width="5" height="26" rx="2.5" fill="#F26B1D"/><text x="48" y="46" font-size="21" font-weight="700" fill="#1F1F1F">자동화 후보는 빈도 × 소요시간이 큰 일부터 고릅니다</text><text x="48" y="72" font-size="13.5" fill="#5C5A57">월 절감 시간 = 월 발생 횟수 × 1회 소요 분 — 큰 칸부터 손댑니다</text><rect x="50.0" y="116.0" width="412.0" height="110.0" rx="12" fill="#E7F6EF" stroke="#13976A" stroke-width="2.6"/><circle cx="256.0" cy="148.5" r="11" fill="#13976A" fill-opacity="0.18" stroke="#13976A" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="256.0" cy="148.5" r="6" fill="none" stroke="#13976A" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="256.0" cy="148.5" r="2" fill="#13976A"/><text x="256.0" y="180.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">자주 · 오래 걸림</text><text x="256.0" y="201.5" font-size="12" fill="#5C5A57" text-anchor="middle">1순위 자동화 — 아침 메일 브리핑, 배치 결과 정리</text><rect x="498.0" y="116.0" width="412.0" height="110.0" rx="12" fill="#EAF2FF" stroke="#2F6FDE" stroke-width="2"/><path d="M704.0 137.5L716.0 143.5L704.0 149.5L692.0 143.5Z" fill="#2F6FDE" fill-opacity="0.18" stroke="#2F6FDE" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M692.0 149.5L704.0 155.5L716.0 149.5M692.0 154.5L704.0 160.5L716.0 154.5" fill="none" stroke="#2F6FDE" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="704.0" y="180.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">자주 · 금방 끝남</text><text x="704.0" y="201.5" font-size="12" fill="#5C5A57" text-anchor="middle">2순위 — 여러 개를 한 워크플로로 묶기</text><rect x="50.0" y="266.0" width="412.0" height="110.0" rx="12" fill="#FFF6D9" stroke="#C08A00" stroke-width="2"/><path d="M247.0 286.5H260.0L266.0 292.5V310.5H247.0Z" fill="#C08A00" fill-opacity="0.18" stroke="#C08A00" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M252.0 296.5H261.0M252.0 301.5H261.0M252.0 306.5H258.0" fill="none" stroke="#C08A00" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="256.0" y="330.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">가끔 · 오래 걸림</text><text x="256.0" y="351.5" font-size="12" fill="#5C5A57" text-anchor="middle">반자동 — 초안만 만들고 사람이 마무리</text><rect x="498.0" y="266.0" width="412.0" height="110.0" rx="12" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/><path d="M704.0 286.5L716.0 308.5H692.0Z" fill="#6B7280" fill-opacity="0.18" stroke="#6B7280" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M704.0 294.5V301.5" fill="none" stroke="#6B7280" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="704.0" cy="305.5" r="1.4" fill="#6B7280"/><text x="704.0" y="330.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">가끔 · 금방 끝남</text><text x="704.0" y="351.5" font-size="12" fill="#5C5A57" text-anchor="middle">그대로 두기 — 만드는 시간이 더 듦</text><text x="36" y="426.0" font-size="12.5" fill="#5C5A57">· 위쪽 = 월 20회 이상, 왼쪽 = 1회 15분 이상을 기준선으로 잡아 보세요. 판단·책임이 필요한 일은 칸과 관계없이 사람 승인을 둡니다.</text></svg>
