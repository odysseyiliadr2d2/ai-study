<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="LoRA는 원래 가중치를 얼리고 작은 행렬 두 개만 학습합니다" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', sans-serif"><title>LoRA는 원래 가중치를 얼리고 작은 행렬 두 개만 학습합니다</title><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A8680"/></marker></defs><rect x="1" y="1" width="958" height="428" rx="18" fill="#FFFFFF" stroke="#DEDBD6" stroke-width="1.5"/><rect x="32" y="26" width="5" height="26" rx="2.5" fill="#F26B1D"/><text x="48" y="46" font-size="21" font-weight="700" fill="#1F1F1F">LoRA는 원래 가중치를 얼리고 작은 행렬 두 개만 학습합니다</text><text x="48" y="72" font-size="13.5" fill="#5C5A57">출력 = W·x + B·A·x  ·  A 는 r × d, B 는 d × r (r 은 랭크)</text><rect x="262.0" y="235.0" width="436.0" height="120.0" rx="14" fill="#F1EDFC" fill-opacity="0.45" stroke="#7656D6" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="274.0" y="225.0" width="187.4" height="20" rx="10" fill="#FFFFFF" stroke="#7656D6" stroke-width="1.4"/><text x="283.0" y="239.0" font-size="12" font-weight="700" fill="#7656D6">학습하는 부분 · 전체의 1% 미만</text><path d="M238.0 162.0H274.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M144.0 208.0V294.0H274.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M462.0 294.0H498.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M686.0 162.0H722.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M686.0 294.0H816.0V208.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><rect x="50.0" y="116.0" width="188.0" height="92.0" rx="12" fill="#EAF2FF" stroke="#2F6FDE" stroke-width="2"/><rect x="132.0" y="132.5" width="7" height="14" rx="2" fill="#2F6FDE" fill-opacity="0.18" stroke="#2F6FDE" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><rect x="140.5" y="132.5" width="7" height="14" rx="2" fill="#2F6FDE" fill-opacity="0.18" stroke="#2F6FDE" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><rect x="149.0" y="132.5" width="7" height="14" rx="2" fill="#2F6FDE" fill-opacity="0.18" stroke="#2F6FDE" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="144.0" y="171.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">입력 x</text><text x="144.0" y="192.5" font-size="12" fill="#5C5A57" text-anchor="middle">토큰 표현</text><rect x="274.0" y="116.0" width="412.0" height="92.0" rx="12" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/><rect x="470.0" y="136.5" width="20" height="15" rx="3" fill="#6B7280" fill-opacity="0.18" stroke="#6B7280" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M474.0 136.5V132.5A6 6 0 0 1 486.0 132.5V136.5" fill="none" stroke="#6B7280" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="480.0" y="171.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">원래 가중치 W (얼림)</text><text x="480.0" y="192.5" font-size="12" fill="#5C5A57" text-anchor="middle">수십억 개 · 학습 안 함</text><rect x="274.0" y="248.0" width="188.0" height="92.0" rx="12" fill="#F1EDFC" stroke="#7656D6" stroke-width="2"/><path d="M368.0 260.5L380.0 266.5L368.0 272.5L356.0 266.5Z" fill="#7656D6" fill-opacity="0.18" stroke="#7656D6" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M356.0 272.5L368.0 278.5L380.0 272.5M356.0 277.5L368.0 283.5L380.0 277.5" fill="none" stroke="#7656D6" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="368.0" y="303.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">A (r × d)</text><text x="368.0" y="324.5" font-size="12" fill="#5C5A57" text-anchor="middle">r 차원으로 줄임</text><rect x="498.0" y="248.0" width="188.0" height="92.0" rx="12" fill="#F1EDFC" stroke="#7656D6" stroke-width="2"/><path d="M592.0 260.5L604.0 266.5L592.0 272.5L580.0 266.5Z" fill="#7656D6" fill-opacity="0.18" stroke="#7656D6" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M580.0 272.5L592.0 278.5L604.0 272.5M580.0 277.5L592.0 283.5L604.0 277.5" fill="none" stroke="#7656D6" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="592.0" y="303.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">B (d × r)</text><text x="592.0" y="324.5" font-size="12" fill="#5C5A57" text-anchor="middle">다시 늘림 · 0 으로 시작</text><rect x="722.0" y="116.0" width="188.0" height="92.0" rx="12" fill="#E7F6EF" stroke="#13976A" stroke-width="2.6"/><circle cx="816.0" cy="139.5" r="11" fill="#13976A" fill-opacity="0.18" stroke="#13976A" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M811.0 139.5L815.0 143.5L822.0 135.5" fill="none" stroke="#13976A" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="816.0" y="171.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">출력</text><text x="816.0" y="192.5" font-size="12" fill="#5C5A57" text-anchor="middle">W·x + B·A·x</text><rect x="735.5" y="273.0" width="31.0" height="16" rx="4" fill="#FFFFFF" fill-opacity="0.92"/><text x="751.0" y="285.0" font-size="11.5" font-weight="600" fill="#5C5A57" text-anchor="middle">더함</text><text x="36" y="390.0" font-size="12.5" fill="#5C5A57">· QLoRA 는 얼린 W 를 4비트로 양자화해 올려 메모리를 더 줄입니다. 어댑터 파일은 수십 MB 수준입니다.</text></svg>
