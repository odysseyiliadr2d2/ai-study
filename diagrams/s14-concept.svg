<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 538" width="960" height="538" role="img" aria-label="화면과 API를 나누면 같은 기능을 여러 화면과 시스템이 함께 씁니다" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', sans-serif"><title>화면과 API를 나누면 같은 기능을 여러 화면과 시스템이 함께 씁니다</title><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A8680"/></marker></defs><rect x="1" y="1" width="958" height="536" rx="18" fill="#FFFFFF" stroke="#DEDBD6" stroke-width="1.5"/><rect x="32" y="26" width="5" height="26" rx="2.5" fill="#F26B1D"/><text x="48" y="46" font-size="21" font-weight="700" fill="#1F1F1F">화면과 API를 나누면 같은 기능을 여러 화면과 시스템이 함께 씁니다</text><text x="48" y="72" font-size="13.5" fill="#5C5A57">업무 요청 접수 서비스 — 화면은 API를 부르고, 규칙은 서비스 계층 한곳에</text><path d="M181.3 200.0V240.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M480.0 200.0V240.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M778.7 200.0V240.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M330.7 324.0V364.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M611.3 406.0H647.3" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><rect x="50.0" y="116.0" width="262.7" height="84.0" rx="12" fill="#EAF2FF" stroke="#2F6FDE" stroke-width="2"/><rect x="169.3" y="125.5" width="24" height="20" rx="2.5" fill="#2F6FDE" fill-opacity="0.18" stroke="#2F6FDE" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M169.3 131.5H193.3" fill="none" stroke="#2F6FDE" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="181.3" y="167.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">