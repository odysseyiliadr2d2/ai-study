oin="round" stroke-linecap="round"/><text x="778.7" y="415.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">저장소</text><text x="778.7" y="436.5" font-size="12" fill="#5C5A57" text-anchor="middle">오늘은 메모리 → 세션 15 DB</text><rect x="185.3" y="212.0" width="37.4" height="16" rx="4" fill="#FFFFFF" fill-opacity="0.92"/><text x="189.3" y="224.0" font-size="11.5" font-weight="600" fill="#5C5A57" text-anchor="start">JSON</text><text x="36" y="498.0" font-size="12.5" fill="#5C5A57">· 화면을 바꾸거나 새 시스템이 붙어도 API 규격과 서비스 계층은 그대로 둡니다.</text></svg>
