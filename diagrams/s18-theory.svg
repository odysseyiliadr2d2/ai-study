h d="M710.0 243.5Q717.0 243.5 717.0 251.5" fill="none" stroke="#E8661C" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="704.0" y="273.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">언제</text><text x="704.0" y="294.5" font-size="12" fill="#5C5A57" text-anchor="middle">팀 공유, n8n·사내 앱, 여러 사용자·서버</text><rect x="50.0" y="340.0" width="412.0" height="72.0" rx="12" fill="#E5F5F6" stroke="#0E8F9C" stroke-width="2"/><path d="M256.0 341.5L266.0 345.5V353.5Q266.0 362.5 256.0 365.5Q246.0 362.5 246.0 353.5V345.5Z" fill="#0E8F9C" fill-opacity="0.18" stroke="#0E8F9C" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="256.0" y="385.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">보안</text><text x="256.0" y="406.5" font-size="12" fill="#5C5A57" text-anchor="middle">실행 사용자 권한 그대로 · stdout 은 프로토콜 전용</text><rect x="498.0" y="340.0" width="412.0" height="72.0" rx="12" fill="#FDECEC" stroke="#C0282D" stroke-width="2"/><rect x="694.0" y="350.5" width="20" height="15" rx="3" fill="#C0282D" fill-opacity="0.18" stroke="#C0282D" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M698.0 350.5V346.5A6 6 0 0 1 710.0 346.5V350.5" fill="none" stroke="#C0282D" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="704.0" y="385.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">보안</text><text x="704.0" y="406.5" font-size="12" fill="#5C5A57" text-anchor="middle">기본은 인증 없음 → 토큰·OAuth, Host 검사, 127.0.0.1 바인딩</text><text x="36" y="462.0" font-size="12.5" fill="#5C5A57">· 같은 서버 코드로 둘 다 지원할 수 있습니다: mcp.run() 은 stdio, mcp.run(&quot;streamable-http&quot;) 은 HTTP.</text></svg>
