<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 502" width="960" height="502" role="img" aria-label="stdio 는 내 PC 안에서, Streamable HTTP 는 네트워크 너머에서 씁니다" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', sans-serif"><title>stdio 는 내 PC 안에서, Streamable HTTP 는 네트워크 너머에서 씁니다</title><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A8680"/></marker></defs><rect x="1" y="1" width="958" height="500" rx="18" fill="#FFFFFF" stroke="#DEDBD6" stroke-width="1.5"/><rect x="32" y="26" width="5" height="26" rx="2.5" fill="#F26B1D"/><text x="48" y="46" font-size="21" font-weight="700" fill="#1F1F1F">stdio 는 내 PC 안에서, Streamable HTTP 는 네트워크 너머에서 씁니다</text><text x="48" y="72" font-size="13.5" fill="#5C5A57">전송 방식 비교와 각각 챙길 보안</text><path d="M256.0 188.0V228.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M256.0 300.0V340.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M704.0 188.0V228.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M704.0 300.0V340.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><rect x="50.0" y="116.0" width="412.0" height="72.0" rx="12" fill="#EAF2FF" stroke="#2F6FDE" stroke-width="2"/><rect x="244.0" y="119.5" width="24" height="20" rx="3" fill="#2F6FDE" fill-opacity="0.18" stroke="#2F6FDE" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M249.0 125.5L253.0 129.5L249.0 133.5M255.0 134.5H262.0" fill="none" stroke="#2F6FDE" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="256.0" y="161.5" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">stdio</text><text x="256.0" y="182.5" font-size="12" fill="#5C5A57" text-anchor=