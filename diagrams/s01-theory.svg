<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="학습은 한 번 무겁게, 추론은 요청마다 가볍게 일어납니다" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR', sans-serif"><title>학습은 한 번 무겁게, 추론은 요청마다 가볍게 일어납니다</title><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A8680"/></marker></defs><rect x="1" y="1" width="958" height="428" rx="18" fill="#FFFFFF" stroke="#DEDBD6" stroke-width="1.5"/><rect x="32" y="26" width="5" height="26" rx="2.5" fill="#F26B1D"/><text x="48" y="46" font-size="21" font-weight="700" fill="#1F1F1F">학습은 한 번 무겁게, 추론은 요청마다 가볍게 일어납니다</text><text x="48" y="72" font-size="13.5" fill="#5C5A57">학습(training)이 만든 가중치를 추론(inference)이 불러 씁니다</text><rect x="38.0" y="103.0" width="660.0" height="120.0" rx="14" fill="#EAF2FF" fill-opacity="0.45" stroke="#2F6FDE" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="50.0" y="93.0" width="109.2" height="20" rx="10" fill="#FFFFFF" stroke="#2F6FDE" stroke-width="1.4"/><text x="59.0" y="107.0" font-size="12" font-weight="700" fill="#2F6FDE">학습 · 미리 한 번</text><rect x="262.0" y="235.0" width="660.0" height="120.0" rx="14" fill="#FFF1E7" fill-opacity="0.45" stroke="#E8661C" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="274.0" y="225.0" width="101.5" height="20" rx="10" fill="#FFFFFF" stroke="#E8661C" stroke-width="1.4"/><text x="283.0" y="239.0" font-size="12" font-weight="700" fill="#E8661C">추론 · 요청마다</text><path d="M238.0 162.0H274.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M462.0 162.0H498.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M592.0 208.0V248.0" fill="none" stroke="#8A8680" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M462.0 294.0H498.0" fill="none" stroke="#8A8680"