<!DOCTYPE html>
<!-- app/templates/requests.html — Jinja2 목록 화면 + 등록 폼 (등록은 REST API 로) -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>업무 요청</title>
</head>
<body style="max-width: 960px; margin: 0 auto; padding: 24px">
<h1>업무 요청</h1>

<form id="request-form" style="display: grid; gap: 8px">
  <label>제목 <input name="title" required minlength="5" maxlength="100"></label>
  <small class="err" data-field="title"></small>
  <label>내용 <textarea name="body" rows="5" required minlength="10" maxlength="4000"></textarea></label>
  <small class="err" data-field="body"></small>
  <label>마감일 <input name="dueDate" type="date"></label>
  <small class="err" data-field="dueDate"></small>
  <button type="submit">접수</button>
  <p id="message" role="status"></p>
</form>

<table style="width: 100%; margin-top: 24px">
  <thead><tr><th>제목</th><th>상태</th><th>분류</th><th>요약</th><th>접수일시</th></tr></thead>
  <tbody>
  {% for r in items %}
  <tr>
    <td>{{ r.title }}</td>
    <td>{{ {"RECEIVED": "접수", "IN_PROGRESS": "처리 중", "DONE": "완료"}[r.status] }}</td>
    <td>{{ r.category or "-" }}</td>
    <td>{{ r.summary or "-" }}</td>
    <td>{{ r.created_at.strftime("%Y-%m-%d %H:%M") }}</td>
  </tr>
  {% else %}
  <tr><td colspan="5">등록된 요청이 없습니다.</td></tr>
  {% endfor %}
  </tbody>
</table>

<script>
  const form = document.getElementById('request-form');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    document.querySelectorAll('.err').forEach((el) => (el.textContent = ''));
    const data = Object.fromEntries(new FormData(form));
    if (!data.dueDate) delete data.dueDate;   // 빈 날짜는 보내지 않음

    const res = await fetch('/api/requests', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data),
    });
    const msg = document.getElementById('message');
    if (res.status === 400) {
      const body = await res.json().catch(() => ({}));
      Object.entries(body.errors || {}).forEach(([field, list]) => {
        const el = document.querySelector('.err[data-field="' + field + '"]');
        if (el) el.textContent = [].concat(list).join(', ');
      });
      msg.textContent = body.message || '입력값을 확인하세요';
      return;
    }
    if (!res.ok) { msg.textContent = '저장하지 못했습니다. 잠시 후 다시 시도하세요.'; return; }
    location.reload();
  });
</script>
</body>
</html>
