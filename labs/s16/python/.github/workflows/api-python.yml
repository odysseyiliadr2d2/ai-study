# .github/workflows/api-python.yml — Python 트랙: 테스트 → 이미지 빌드 · GHCR 푸시 → Kubernetes 배포
# 저장소 Secrets: KUBECONFIG_B64 (배포용 서비스 계정의 kubeconfig 를 base64 로)
# 사내 클러스터라면 deploy 잡은 사내망 안의 self-hosted runner 에서 돌립니다.
name: api-python

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ticket-desk-py

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q          # SQLite 메모리 DB · 가짜 AI 함수로 돌아 Oracle · API 키가 필요 없습니다

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}   # latest 대신 커밋 SHA

  deploy:
    needs: image
    runs-on: ubuntu-latest      # 사내 클러스터: runs-on: [self-hosted, intranet]
    environment: production
    steps:
      - name: kubeconfig 준비
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: 이미지 교체와 롤아웃 확인 (실패하면 자동 롤백)
        run: |
          kubectl -n ticketdesk set image deployment/ticket-desk-py app=${{ env.IMAGE }}:${{ github.sha }}
          kubectl -n ticketdesk annotate deployment/ticket-desk-py \
            kubernetes.io/change-cause="${{ github.sha }} by ${{ github.actor }}" --overwrite
          if ! kubectl -n ticketdesk rollout status deployment/ticket-desk-py --timeout=300s; then
            echo "롤아웃 실패 — 이전 버전으로 되돌립니다" >&2
            kubectl -n ticketdesk rollout undo deployment/ticket-desk-py
            exit 1
          fi
